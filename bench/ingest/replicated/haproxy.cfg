# One port per shard, to that cluster's current primary (Patroni REST API /primary).
global
  maxconn 2000
defaults
  mode tcp
  timeout connect 2s
  timeout client 30m
  timeout server 30m
  timeout check 1s
  default-server inter 1s fall 2 rise 1 on-marked-down shutdown-sessions
listen shard1
  bind *:5001
  option httpchk GET /primary
  http-check expect status 200
  server s1a s1a:5432 check port 8008
  server s1b s1b:5432 check port 8008
listen shard2
  bind *:5002
  option httpchk GET /primary
  http-check expect status 200
  server s2a s2a:5432 check port 8008
  server s2b s2b:5432 check port 8008
