# TLS termination for IMAP in front of the BEAM nodes.
# Clients connect with implicit TLS on 993 (RFC 8314); HAProxy decrypts and forwards
# plain IMAP to the nodes' PROXY-protocol listener (proxy_port, 1144), prefixing every
# connection with a PROXY v2 header so the server sees the real client address.
# No STARTTLS on 143: HAProxy cannot do it for IMAP and clients use 993.

global
    maxconn 200000
    log stdout format raw local0 notice
    ssl-default-bind-options ssl-min-ver TLSv1.2
    # TLS session cache: clients that reconnect every ~30 min resume instead of a full handshake
    tune.ssl.cachesize 200000
    tune.ssl.lifetime 3600

defaults
    mode tcp
    log global
    maxconn 200000
    timeout connect 5s
    # IDLE lasts up to 29 minutes between client commands
    timeout client 31m
    timeout server 31m

frontend imaps
    bind :993 ssl crt /usr/local/etc/haproxy/certs/imap.pem
    default_backend mailstore

backend mailstore
    balance leastconn
    # Docker Desktop: the BEAM node runs on the host. In production: one line per node.
    server beam1 host.docker.internal:1144 send-proxy-v2 check check-send-proxy inter 5s
