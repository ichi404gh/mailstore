# Recommended postgresql.conf settings for a mail shard (a Patroni cluster member).
# Example machine: 64 GB RAM, 16 cores, NVMe. Scale the memory settings with RAM.
# With Patroni, put these under bootstrap.dcs.postgresql.parameters (or apply with
# `patronictl edit-config`); they are the same on the primary and the standbys.
#
# "measured" = checked on the bench stand (bench/README.md, two replicated shards);
# the rest is recommended and still to be checked on the target hardware.
# Table-level settings and open schema questions: deploy/postgres/README.md.

# --- Memory ---------------------------------------------------------------------
# Every delivery locks a random row of `folders` (~0.5 KB per mailbox with indexes):
# the whole table and the indexes of the current week must stay in memory.
# measured: 512 MB -> 1 GB with the folder table warm took backlog drain from
# ~1,700 to ~3,600 records/s on the stand (430k mailboxes per shard).
shared_buffers = 16GB                  # ~25% of RAM
effective_cache_size = 48GB            # ~75% of RAM
work_mem = 32MB                        # queries are small; SEARCH sorts now and then
maintenance_work_mem = 2GB
huge_pages = try                       # reserve huge pages in the OS for shared_buffers

# --- WAL and checkpoints ------------------------------------------------------------
# After each checkpoint the first change to a page writes the whole page to WAL, and
# deliveries change pages all over `folders`.
# measured: 14 KB -> 3.3 KB of WAL per message with these three settings; before,
# the stand could not keep up with the peak minute.
wal_compression = zstd
max_wal_size = 32GB
checkpoint_timeout = 30min
min_wal_size = 4GB
checkpoint_completion_target = 0.9
wal_buffers = 64MB                     # batches write WAL in bursts
full_page_writes = on                  # never off
# With a synchronous standby: commit returns once the standby has flushed the WAL.
# remote_apply is not needed. commit_delay is not needed either: the application
# already commits a batch of deliveries per transaction.
synchronous_commit = on

# --- Autovacuum -----------------------------------------------------------------
# The defaults are tuned for spinning disks. Table-level settings in the README.
autovacuum_max_workers = 6
autovacuum_vacuum_cost_limit = 2000    # default 200 is far too slow on NVMe
autovacuum_naptime = 15s

# --- Safety -----------------------------------------------------------------------
idle_in_transaction_session_timeout = 60s
max_slot_wal_keep_size = 100GB         # a lagging standby with a slot cannot fill the primary's disk
# statement_timeout: set on the application role (e.g. 30s), not globally, so that
# migrations and maintenance keep their own.

# --- Connections ------------------------------------------------------------------
# Every mailstore node keeps a pool to every shard: nodes x pool_size must fit with
# room to spare. With many nodes put PgBouncer (transaction mode, >= 1.21 with
# max_prepared_statements > 0, or Postgrex prepare: :unnamed) in front.
max_connections = 300

# --- Observability -----------------------------------------------------------------
shared_preload_libraries = 'pg_stat_statements'
track_io_timing = on
log_checkpoints = on
log_autovacuum_min_duration = 1s
log_lock_waits = on

# --- Replication (Patroni manages most of it) --------------------------------------
# Data checksums are on (initdb --data-checksums), so pg_rewind works without
# wal_log_hints; without checksums set wal_log_hints = on.
# hot_standby_feedback: off while nothing reads from the standbys.
