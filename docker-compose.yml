services:
  postgres:
    image: postgres:17
    container_name: mailstore-pg
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "55432:5432"
    command: ["postgres", "-c", "max_connections=200", "-c", "shared_buffers=512MB"]
    volumes:
      - pgdata:/var/lib/postgresql/data

  # TLS on 993 for the IMAP server running on the host (mix run). Needs a certificate:
  #   deploy/haproxy/gen-cert.sh
  haproxy:
    image: haproxy:3.0
    container_name: mailstore-haproxy
    ports:
      - "10993:993"
    volumes:
      - ./deploy/haproxy:/usr/local/etc/haproxy:ro
    ulimits:
      nofile: 1048576
    extra_hosts:
      - "host.docker.internal:host-gateway"

volumes:
  pgdata:
